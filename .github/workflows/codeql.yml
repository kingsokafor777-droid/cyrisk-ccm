name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e2b4f4f64db33f3c56f2650e29777f24c85e6c88 # v3.28.17
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@e2b4f4f64db33f3c56f2650e29777f24c85e6c88 # v3.28.17
