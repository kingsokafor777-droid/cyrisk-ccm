name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@e2b4f4f64db33f3c56f2650e29777f24c85e6c88 # v3.28.17
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@e2b4f4f64db33f3c56f2650e29777f24c85e6c88 # v3.28.17
